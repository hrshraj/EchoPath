[project]
name = "echopath"
version = "0.1.0"
description = "Real-Time Indoor Assistive Navigation System for Visually Impaired Users"
readme = "README.md"
requires-python = ">=3.11,<3.13"

dependencies = [
    # ── PyTorch (CUDA 11.8) ───────────────────────────────────────────────────
    "torch==2.4.1",
    "torchvision==0.19.1",
    "torchaudio==2.4.1",

    # ── HuggingFace stack ─────────────────────────────────────────────────────
    "transformers>=5.0.0",
    "huggingface-hub>=1.0.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.3",

    # ── YOLO ──────────────────────────────────────────────────────────────────
    "ultralytics>=8.3.0",

    # ── Vision / Numerics ─────────────────────────────────────────────────────
    "opencv-python>=4.10.0",
    "pillow>=10.4.0",
    "numpy>=1.26.0,<2.0.0",

    # ── Model backbone ────────────────────────────────────────────────────────
    "timm>=1.0.0",

    # ── Data / Plotting ───────────────────────────────────────────────────────
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "seaborn>=0.13.0",
    "pyyaml>=6.0.1",

    # ── Audio ─────────────────────────────────────────────────────────────────
    "pyttsx3>=2.90",

    # ── Video encoding ────────────────────────────────────────────────────────
    "imageio-ffmpeg==0.6.0",

    # ── Notebook ──────────────────────────────────────────────────────────────
    "jupyter>=1.1.0",
    "ipykernel>=6.29.0",
]

# -----------------------------------------------------------------------------
# Environment management is conda, not uv.
#
#   Jetson_Implementation/environment.yml               workstation spec
#   Jetson_Implementation/requirements-workstation.txt  pip layer
#   Jetson_Implementation/requirements-jetson.txt       the device (Python 3.6)
#
# The uv index configuration that used to live here has been removed. The CUDA 11.8
# torch builds are not on PyPI and must come from the PyTorch index - see
# Jetson_Implementation/SETUP.md for the exact commands.
# -----------------------------------------------------------------------------
